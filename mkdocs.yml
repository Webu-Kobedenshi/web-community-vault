site_name: web-community-vault
theme:
  name: material
  language: ja
nav:
  - Home: index.md
  - About: about.md
  - 年間スケジュール: schedule.md
  - 活動報告:
    - テンプレート: activities/reports/template.md
repo_url: https://github.com/junhat6/web-community-vault
edit_uri: '#root/path/docs/'
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
          