# Project information
site_name: We部ナレッジベース
site_url: https://junhat6.github.io/web-community-vault/
# site_author: Martin Donath
# site_description: >-
#   Write your documentation in Markdown and create a professional static site in
#   minutes – searchable, customizable, in 60+ languages, for all devices

# Repository
# repo_name: junhat6/web-community-vault
repo_url: https://github.com/junhat6/web-community-vault

# Configuration
theme:
  name: material
  features:
    # - content.action.edit
    # - content.action.view
    # - content.code.annotate
    # - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    # - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    # - toc.follow
    # - toc.integrate
  language: ja
  font:
    text: Noto Sans JP
    code: Noto Sans Mono
  favicon: assets/images/webu_icon_nospace.png
  logo: assets/images/webu_icon_nospace.png

# Plugins
plugins:
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      archive_name: アーカイブ
      archive_date_format: yyyy年
      categories_name: カテゴリー
      pagination_per_page: 10
  - search:
      lang: ja
  - minify:
      minify_html: true
  - htmlproofer:
      enabled: !ENV [CI, false]
      raise_error: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - はじめに: index.md
  - We部について: We部について.md
  - 年間予定:
      - 2026年度: schedule/2026年度.md
      - 2026年度ソフト4: schedule/2026年度ソフト4.md
      - 第1回活動（5/7）: schedule/2026年度第1回活動.md
      - 出欠状況: schedule/出欠状況.md
  - 活動場所:
      - access/index.md
      - オプティムワークスペース: access/optim-workspace.md
  - Q&A:
      - faq/index.md
      - 参加について: faq/参加について.md
      - 活動内容・ルール: faq/活動内容・ルール.md
      - 活動場所・設備・PC: faq/活動場所・設備・PC.md
      - 費用: faq/費用.md
      - サポート・コミュニケーション: faq/サポート・コミュニケーション.md
      - オプティム・インターン連携: faq/オプティム・インターン連携.md
  - 記録ブログ:
      - blog/index.md
