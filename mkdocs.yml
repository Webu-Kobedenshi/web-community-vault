site_name: We部 資料 置き場
site_url: https://junhat6.github.io/web-community-vault/

repo_url: https://github.com/junhat6/web-community-vault

theme:
  name: material
  features:
    # - content.action.edit
    # - content.action.view
    # - content.code.annotate
    # - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    # - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    # - toc.follow
    # - toc.integrate
  language: ja
  font:
    text: Noto Sans JP
    code: Noto Sans Mono
  # favicon: assets/favicon.png

plugins:
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      archive_name: アーカイブ
      archive_date_format: yyyy年
      categories_name: カテゴリー
      pagination_per_page: 10
  - search:
      lang: ja
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
          
nav:
  - はじめに: index.md
  - We部について: about.md
  - 年間スケジュール: schedule.md
  - Q&A: faq.md
  - 運営メモ: operations.md
  - 活動記録:
    - blog/index.md