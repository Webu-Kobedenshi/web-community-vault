name: link-check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 振り返り用FigJamボードは認証が必要なため、このボードのみ除外する。
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --exclude "https://discord\.gg/"
            --exclude "https://discord\.com/"
            --exclude "^https://www\.figma\.com/board/mK8yZ2KSsVQLU6wIwrgSCF(/|[?]|$)"
            --include-verbatim
            docs/
          fail: true
