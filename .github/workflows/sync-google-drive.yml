name: Sync Google Drive
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
jobs:
  rclone:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: rclone
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: sync docs gdrive:/web-community-vault