name: Sync Google Drive
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
jobs:
  rclone:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Convert md to txt
      run: |
        cp -r docs /tmp/docs-sync
        find /tmp/docs-sync -name "*.md" | while read f; do
          mv "$f" "${f%.md}.txt"
        done
    - name: rclone
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: sync /tmp/docs-sync gdrive:/web-community-vault